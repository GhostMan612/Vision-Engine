# Vision-Engine Python CI: lint + test the host-side Python truth.
# The Python here is stdlib-only (rename scripts + tools + tests), so there
# is no requirements.txt to install and nothing to publish to PyPI — the old
# stock template ran bare `pytest` with zero test files (exit 5) and this
# repo's second workflow tried to build a package that does not exist.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m py_compile rename_camera_prefixes.py rename_min.py tools/*.py
        pytest -q tests/
